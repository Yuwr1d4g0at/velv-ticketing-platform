name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Keep in sync with the "engines" field in package.json - the app
          # needs 22.5+ for the built-in node:sqlite module.
          node-version: "22.x"
          cache: "npm"

      - run: npm ci
      - run: npm test
